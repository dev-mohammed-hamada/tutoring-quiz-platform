name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quiz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://quiz:quiz@localhost:5432/quiz_test
      E2E_DATABASE_URL: postgres://quiz:quiz@localhost:5432/quiz_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The rule that decays silently, so it fails the build rather than a review.
      - name: No physical CSS properties
        run: |
          if grep -rnE '(margin|padding|border)-(left|right):|text-align:[[:space:]]*(left|right)' web/src; then
            echo "Use logical properties (margin-inline-start, text-align: start)"; exit 1;
          fi

      # Vitest does not typecheck, so the build is the only thing that does.
      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      # The e2e suite rebuilds this database from the seed on every run, but it
      # has to exist first; the service container only creates quiz_test.
      - name: Create the e2e database
        run: PGPASSWORD=quiz createdb -h localhost -U quiz quiz_e2e || true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests at phone width
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
