services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    # Published on 5433: a local Postgres already holds 5432 on the development
    # machine. Container-internal stays 5432, so a clean machine sees no difference.
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://quiz:quiz@db:5432/quiz
      PORT: 3000
      TZ: UTC
      NODE_ENV: production
      SESSION_SECRET: dev-secret-not-for-production
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
